<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Smart Agriculture Hanjeli{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    body { background: #f3f6f4; color: #24332b; }
    #sidebar { min-height: 100vh; background: #173b2b; }
    #sidebar a { color: rgba(255,255,255,.76); text-decoration: none; transition: .18s ease; }
    #sidebar a:hover, #sidebar a.active { background: #2d7650; color: #fff; }
    #main-content { min-height: 100vh; }
    @media (max-width: 767.98px) { #sidebar { min-height: auto; } }
  </style>
  {% block extra_head %}{% endblock %}
</head>
<body>
  <div class="container-fluid">
    <div class="row">
      <nav id="sidebar" class="col-md-3 col-lg-2 p-3">
        <div class="text-white fw-bold fs-5 mb-4">
          <i class="bi bi-flower2 me-2 text-success"></i>Smart Agriculture
        </div>
        <div class="text-uppercase text-white-50 small mb-2">Modul Administrasi</div>
        <div class="nav flex-column gap-1">
          <a href="{% url 'prediktor:deteksi_jagung' %}" class="rounded px-3 py-2 {% if request.resolver_match.url_name == 'deteksi_jagung' %}active{% endif %}"><i class="bi bi-image me-2"></i>Deteksi Daun Jagung</a>
          <a href="{% url 'dashboard_main' %}" class="rounded px-3 py-2 {% if request.resolver_match.url_name == 'dashboard_main' %}active{% endif %}">
            <i class="bi bi-house-fill me-2"></i>Dashboard
          </a>
          <a href="{% url 'administrasi:kelola_sensor' %}" class="rounded px-3 py-2 {% if request.resolver_match.url_name == 'kelola_sensor' %}active{% endif %}">
            <i class="bi bi-cpu-fill me-2"></i>Kelola Sensor
          </a>
          <a href="{% url 'administrasi:pot_list' %}" class="rounded px-3 py-2 {% if request.resolver_match.url_name == 'pot_list' or request.resolver_match.url_name == 'pot_create' or request.resolver_match.url_name == 'pot_update' or request.resolver_match.url_name == 'pot_delete' %}active{% endif %}">
            <i class="bi bi-box-seam me-2"></i>Kelola Pot
          </a>
          <span class="rounded px-3 py-2 text-white-50"><i class="bi bi-droplet-fill me-2"></i>Kelola Penyiraman <small>(Segera hadir)</small></span>
        </div>
      </nav>

      <main id="main-content" class="col-md-9 col-lg-10 p-3 p-lg-4" {% block page_attributes %}{% endblock %}>
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>
  {% block extra_scripts %}{% endblock %}
</body>
</html>
